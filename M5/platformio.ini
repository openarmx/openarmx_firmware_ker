; PlatformIO Project Configuration File
;
; The KER environment is the product firmware. It starts in USB mode and
; switches between USB Vendor and WiFi TCP through the USB CDC control channel.
;
; CLI:
;   pio run --target upload

[platformio]
default_envs = ker

[env]
; Keep CI on the Arduino ESP32 2.0.17 toolchain validated for this firmware.
platform  = espressif32@7.1.1
board     = m5stack-cores3
framework = arduino
extra_scripts = post:scripts/merge_firmware.py
lib_deps  =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    https://github.com/m5stack/M5Unit-Joystick2.git#97b622b0f3155d1c720b5df6e60e0c41bab2050b
    https://github.com/m5stack/M5Unit-Scroll.git#77ec3033b94cbd6f9a3fd886b8207d26029082ac
    bblanchon/ArduinoJson@6.21.6

[env:ker]
build_src_filter =
    +<*>
    -<SerialStream.cpp>
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -D USE_RUNTIME
    -D CONFIG_TINYUSB_VENDOR_ENABLED=1
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
