name: Sync to Gitee

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub Release tag to synchronize
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Published GitHub Release tag to synchronize
        required: true
        type: string
    secrets:
      GITEE_SSH_PRIVATE_KEY:
        required: true
      GITEE_ACCESS_TOKEN:
        required: true

concurrency:
  group: sync-gitee-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITEE_REPOSITORY: chengdu-changshu-robot/openarmx_firmware_ker
  GITEE_GIT_URL: git@gitee.com:chengdu-changshu-robot/openarmx_firmware_ker.git

jobs:
  source:
    name: Source and tags
    runs-on: ubuntu-22.04
    env:
      GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
    steps:
      - name: Check source synchronization credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$GITEE_SSH_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure the GITEE_SSH_PRIVATE_KEY repository secret."
            echo "GITEE_SSH_PRIVATE_KEY is not configured; source synchronization failed." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout GitHub repository
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Gitee SSH access
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > "$HOME/.ssh/gitee_sync"
          chmod 600 "$HOME/.ssh/gitee_sync"
          ssh-keyscan -H gitee.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host gitee.com
            HostName gitee.com
            User git
            IdentityFile ~/.ssh/gitee_sync
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Push GitHub branches and tags to Gitee
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git remote add gitee "$GITEE_GIT_URL"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          # Gitee releases can create lightweight tags where GitHub has
          # annotated tags. Compare their commits before attempting a push;
          # pushing an existing tag with a different object is rejected.
          # Keep Gitee's tags separate from the GitHub source tags.
          git fetch --no-tags gitee \
            '+refs/tags/*:refs/gitee-tags/*' --prune
          tag_refspecs=()
          while IFS= read -r tag_ref; do
            tag="${tag_ref#refs/tags/}"
            gitee_tag_ref="refs/gitee-tags/$tag"
            if git show-ref --verify --quiet "$gitee_tag_ref"; then
              if [[ "$(git rev-parse "$tag_ref")" == "$(git rev-parse "$gitee_tag_ref")" ]]; then
                echo "Tag $tag is already synchronized."
              elif [[ "$(git rev-parse "$tag_ref^{commit}")" == "$(git rev-parse "$gitee_tag_ref^{commit}")" ]]; then
                echo "Tag $tag points to the same commit; keeping the existing Gitee tag."
              else
                echo "::error::Tag $tag points to different commits on GitHub and Gitee. Resolve the tag conflict before retrying."
                exit 1
              fi
            else
              tag_refspecs+=("$tag_ref:$tag_ref")
            fi
          done < <(git for-each-ref --format='%(refname)' refs/tags)

          while IFS= read -r branch; do
            if ! git push gitee "refs/remotes/origin/$branch:refs/heads/$branch"; then
              echo "::error::Failed to push branch $branch to Gitee. Check the Git output above for SSH permissions, branch protection, or divergent history."
              exit 1
            fi
          done < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
              | grep -v '^HEAD$'
          )

          if (( ${#tag_refspecs[@]} > 0 )); then
            if ! git push gitee "${tag_refspecs[@]}"; then
              echo "::error::Failed to push new tags to Gitee. Check the Git output above for permissions or concurrent tag changes."
              exit 1
            fi
          fi
          echo "Synchronized GitHub branches and tags to Gitee." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release assets
    needs: source
    if: >-
      github.event_name == 'release' ||
      inputs.release_tag != ''
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
      INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check Release synchronization credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$GITEE_ACCESS_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure the GITEE_ACCESS_TOKEN repository secret."
            echo "GITEE_ACCESS_TOKEN is not configured; Release synchronization failed." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resolve GitHub Release
        if: steps.credentials.outputs.configured == 'true'
        id: release
        shell: bash
        run: |
          if [[ -n "$EVENT_RELEASE_TAG" ]]; then
            tag="$EVENT_RELEASE_TAG"
          else
            tag="$INPUT_RELEASE_TAG"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > github-release.json
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download GitHub Release assets
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir release-assets
          if [[ "$(jq '.assets | length' github-release.json)" -gt 0 ]]; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release-assets
          fi

      - name: Create Gitee Release and upload assets
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="$RELEASE_TAG"
          name="$(jq -r '.name // .tag_name' github-release.json)"
          body="$(jq -r '.body // ""' github-release.json)"
          prerelease="$(jq -r '.prerelease // false' github-release.json)"
          target_commitish="$(jq -r '.target_commitish // "main"' github-release.json)"

          lookup_status="$(
            curl --silent --show-error --get \
              --data-urlencode "access_token=$GITEE_ACCESS_TOKEN" \
              --output gitee-release-lookup.json \
              --write-out '%{http_code}' \
              "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases/tags/$tag"
          )"
          if [[ "$lookup_status" == "200" ]]; then
            existing_id="$(jq -er '.id' gitee-release-lookup.json)"
          elif [[ "$lookup_status" == "404" ]]; then
            existing_id=""
          else
            echo "Gitee Release lookup failed with HTTP $lookup_status" >&2
            exit 1
          fi
          if [[ -n "$existing_id" ]]; then
            curl --fail --silent --show-error \
              --request DELETE \
              "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases/$existing_id?access_token=$GITEE_ACCESS_TOKEN"
          fi

          release_status="$(
            curl --silent --show-error \
              --request POST \
              --data-urlencode "tag_name=$tag" \
              --data-urlencode "target_commitish=$target_commitish" \
              --data-urlencode "name=$name" \
              --data-urlencode "body=$body" \
              --data-urlencode "prerelease=$prerelease" \
              --output gitee-release-response.json \
              --write-out '%{http_code}' \
              "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases?access_token=$GITEE_ACCESS_TOKEN"
          )"
          if [[ ! "$release_status" =~ ^2 ]]; then
            echo "Gitee Release creation failed with HTTP $release_status" >&2
            exit 1
          fi
          release_response="$(cat gitee-release-response.json)"
          release_id="$(jq -er '.id' <<< "$release_response")"

          for asset in release-assets/*; do
            asset_status="$(
              curl --silent --show-error \
                --request POST \
                --form "file=@$asset" \
                --output gitee-asset-response.json \
                --write-out '%{http_code}' \
                "https://gitee.com/api/v5/repos/$GITEE_REPOSITORY/releases/$release_id/attach_files?access_token=$GITEE_ACCESS_TOKEN"
            )"
            if [[ ! "$asset_status" =~ ^2 ]]; then
              echo "Gitee asset upload failed with HTTP $asset_status: $(basename "$asset")" >&2
              exit 1
            fi
            echo "Uploaded $(basename "$asset")"
          done

          echo "Synchronized GitHub Release $tag to Gitee." >> "$GITHUB_STEP_SUMMARY"
